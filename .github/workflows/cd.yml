# CD: on every push to main, run CI (which builds and pushes the SHA-tagged images to GHCR),
# then deploy those exact images to Azure, publish the UI, and fail unless both services are healthy.
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy to Azure
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PREFIX: ${{ vars.PREFIX }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      UI_STORAGE: ${{ vars.UI_STORAGE }}
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare names
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "SQL_HOST=${PREFIX}-sql.database.windows.net" >> "$GITHUB_ENV"

      - name: Store each service's DATABASE_URL as a Container Apps secret
        env:
          SCHEDULING_DB_PASSWORD: ${{ secrets.SCHEDULING_DB_PASSWORD }}
          TRIPS_DB_PASSWORD: ${{ secrets.TRIPS_DB_PASSWORD }}
        run: |
          az containerapp secret set --name "$PREFIX-scheduling" --resource-group "$RESOURCE_GROUP" --only-show-errors -o none \
            --secrets "database-url=mssql://scheduling_user:${SCHEDULING_DB_PASSWORD}@${SQL_HOST}:1433/${PREFIX}-scheduling-db"
          az containerapp secret set --name "$PREFIX-trips" --resource-group "$RESOURCE_GROUP" --only-show-errors -o none \
            --secrets "database-url=mssql://trips_user:${TRIPS_DB_PASSWORD}@${SQL_HOST}:1433/${PREFIX}-trips-db"

      - name: Deploy the images built for this commit
        run: |
          for service in scheduling trips; do
            az containerapp update --name "$PREFIX-$service" --resource-group "$RESOURCE_GROUP" --only-show-errors -o none \
              --image "ghcr.io/$OWNER/tripsync-$service:$GITHUB_SHA"
          done

      - name: Look up the services' addresses
        run: |
          echo "SCHEDULING_URL=https://$(az containerapp show --name "$PREFIX-scheduling" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_ENV"
          echo "TRIPS_URL=https://$(az containerapp show --name "$PREFIX-trips" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_ENV"

      - name: Publish the UI with a generated config.js
        run: |
          cat > ui/config.js <<CONFIG
          // Generated by the CD workflow for commit $GITHUB_SHA. Do not edit.
          window.TRIPSYNC_CONFIG = {
            SCHEDULING_URL: "$SCHEDULING_URL",
            TRIPS_URL: "$TRIPS_URL",
          };
          CONFIG
          rm ui/config.local.js
          az storage blob upload-batch --account-name "$UI_STORAGE" --auth-mode key --destination '$web' \
            --source ui --overwrite --only-show-errors -o none

      - name: Health check (fails the run if a service is not healthy on this commit within 6 minutes)
        run: |
          for url in "$SCHEDULING_URL" "$TRIPS_URL"; do
            for attempt in $(seq 1 36); do
              body=$(curl -s --max-time 30 "$url/health" || true)
              version=$(echo "$body" | jq -r '.version // empty' 2>/dev/null || true)
              if [ "$version" = "$GITHUB_SHA" ] && [ "$(echo "$body" | jq -r .status)" = "ok" ]; then
                echo "healthy: $url $body"
                continue 2
              fi
              echo "waiting for $url (attempt $attempt): ${body:-no response}"
              sleep 10
            done
            echo "::error::$url never became healthy on commit $GITHUB_SHA"
            exit 1
          done

      - name: Deployed
        run: |
          {
            echo "### Deployed $GITHUB_SHA"
            echo "- UI: $(az storage account show --name "$UI_STORAGE" --resource-group "$RESOURCE_GROUP" --query primaryEndpoints.web -o tsv)"
            echo "- Scheduling: $SCHEDULING_URL"
            echo "- Trips: $TRIPS_URL"
          } >> "$GITHUB_STEP_SUMMARY"
